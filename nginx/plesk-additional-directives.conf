# === À COLLER DANS PLESK ===
# Plesk > Domaines > 644.fr > "Paramètres Apache & nginx"
#   -> champ "Directives nginx supplémentaires"
# (puis décoche "Traitement intelligent des fichiers statiques" / "Smart static files processing")
#
# Cela envoie tout le trafic du domaine vers le conteneur Docker (port 8080),
# avec le support WebSocket nécessaire à Socket.IO.
#
# IMPORTANT (Plesk) : on utilise "location ^~ /" et NON "location /".
# Plesk génère déjà son propre "location /", donc réutiliser exactement "/"
# provoque l'erreur "duplicate location". Le modificateur "^~" est accepté
# (clé différente) ET prend la priorité, donc tout passe bien vers l'app.

location ^~ / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    # WebSocket / Socket.IO
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
}

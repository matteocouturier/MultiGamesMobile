# === À COLLER DANS PLESK ===
# Plesk > Domaines > 644.fr > "Paramètres Apache & nginx"
#   -> champ "Directives nginx supplémentaires"
# (puis décoche "Traitement intelligent des fichiers statiques" / "Smart static files processing")
#
# Cela envoie tout le trafic du domaine vers le conteneur Docker (port 8080),
# avec le support WebSocket nécessaire à Socket.IO.
#
# IMPORTANT (Plesk) : on utilise une location REGEX "location ~ ^/".
# Plesk a déjà son "location /" (et même "location ^~ /" reste vu comme la clé
# "/" -> erreur "duplicate location"). Une location regex a une CLÉ différente
# (pas de doublon) ET passe AVANT le "location /" de Plesk, donc tout le trafic
# va vers l'app. Le "^~ /.well-known/" de Plesk garde la priorité sur la regex,
# donc le renouvellement du certificat SSL continue de fonctionner.
#
# ⚠️ Décoche bien "Traitement intelligent des fichiers statiques" dans Plesk,
# sinon Plesk ajoute des locations regex pour .js/.css qui captureraient le
# bundle de l'app avant cette règle.

location ~ ^/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    # WebSocket / Socket.IO
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
}

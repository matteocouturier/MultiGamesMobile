# Bloc nginx pour MultiGames sur 644.fr.
# Proxifie vers le conteneur Docker (127.0.0.1:8080) avec le support WebSocket
# (indispensable pour Socket.IO). certbot ajoutera ensuite le bloc HTTPS (443).
server {
    listen 80;
    listen [::]:80;
    server_name 644.fr;

    # Taille des uploads / messages (large par sécurité)
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket / Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Garder les connexions WebSocket ouvertes longtemps
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

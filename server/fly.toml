# Fly.io config — déploiement: `cd server && fly launch --copy-config --now` (puis `fly deploy`).
# Change `app` pour un nom unique avant le premier déploiement.
app = "multigames-server"
primary_region = "cdg"  # Paris

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"

name: Deploy server (SSH)

# Déploiement automatique du serveur sur TON VPS à chaque push sur la branche.
# C'est GitHub qui se connecte en SSH à ton serveur — la clé n'est JAMAIS dans le
# chat ni dans le code : tu la mets en "Secret" GitHub (chiffré).
#
# Secrets à créer (Repo -> Settings -> Secrets and variables -> Actions) :
#   SSH_HOST  : IP ou domaine de ton serveur (ex. 51.crash.12.34)
#   SSH_USER  : utilisateur SSH (ex. root)
#   SSH_KEY   : la clé privée SSH (contenu de ta clé, ex. ~/.ssh/id_ed25519)
#
# Côté serveur, une seule prérequis : Docker installé + git.
#   curl -fsSL https://get.docker.com | sh

on:
  push:
    branches:
      - claude/multiplayer-minigames-app-g7by79
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            REPO_DIR="$HOME/MultiGamesMobile"
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/matteocouturier/MultiGamesMobile.git "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git fetch origin
            git checkout "${GITHUB_REF_NAME:-main}" || git checkout main
            git pull --ff-only origin "${GITHUB_REF_NAME:-main}" || git pull --ff-only origin main
            cd server
            docker build -t multigames-server .
            docker rm -f multigames 2>/dev/null || true
            docker run -d --name multigames --restart unless-stopped -p 80:4000 multigames-server
            sleep 2
            curl -fsS http://localhost/health
